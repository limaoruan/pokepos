<script>
const $=s=>document.querySelector(s), brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cod=n=>{const s=String(n).padStart(9,'0');return s.slice(0,3)+'-'+s.slice(3,6)+'-'+s.slice(6)};
let aba='estoque', folhaAberta=null;
const pag={};
function paginar(sec){
  const g=sec.querySelector('.grid');if(!g)return;
  sec.querySelector('.pg')?.remove();
  const cards=[...g.children].filter(c=>c.classList.contains('card')),k=aba+'|'+folhaAberta;
  if(!cards.length)return;
  const pg=document.createElement('div');pg.className='pg';g.after(pg);
  const tot=cards.length,p=Math.max(0,Math.min(pag[k]||0,tot-1));pag[k]=p;
  cards.forEach((c,i)=>c.hidden=i!==p);
  pg.innerHTML=tot>1?`<button class="btn s sm" data-p="-1" ${p?'':'disabled'}>\u2039 Anterior</button><b>${p+1} / ${tot}</b><button class="btn s sm" data-p="1" ${p<tot-1?'':'disabled'}>Pr\u00f3xima \u203a</button>`:'';
  pg.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{pag[k]=p+Number(b.dataset.p);paginar(sec)});
}

/* ---------- Supabase (sem servidor): login por e-mail/senha + banco com RLS ---------- */
const CFG=window.POKE_CONFIG||{}, SB=String(CFG.SUPABASE_URL||'').replace(/\/+$/,''), CHAVE=String(CFG.SUPABASE_CHAVE||'');
const K_SESSAO='pokepos_sessao', K_EMAIL='pokepos_email';
class ErroApi extends Error{constructor(m,status){super(m);this.status=status}}
const espera=ms=>new Promise(r=>setTimeout(r,ms));
const lerSessao=()=>{try{return JSON.parse(localStorage.getItem(K_SESSAO))}catch(e){return null}};
const gravarSessao=s=>{try{s?localStorage.setItem(K_SESSAO,JSON.stringify(s)):localStorage.removeItem(K_SESSAO)}catch(e){}};
const sessaoDe=d=>({access:d.access_token,refresh:d.refresh_token,exp:d.expires_at?d.expires_at*1000:Date.now()+(d.expires_in||3600)*1000});
const configurado=()=>SB&&CHAVE&&!/COLE|SEU-PROJETO/i.test(SB+CHAVE);
const inteiro=(v,min,max)=>{const n=Number(v);return v!==''&&v!==null&&Number.isInteger(n)&&n>=min&&n<=max?n:null};
function dinheiro(v){
  let s=typeof v==='string'?v.trim():v;
  if(typeof s==='string'){if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');s=Number(s)}
  if(typeof s!=='number'||!Number.isFinite(s))return null;
  s=Math.round(s*100)/100;return s>0&&s<=99999999.99?s.toFixed(2):null;
}
const texto=(v,max=200)=>{const t=typeof v==='string'?v.trim():'';return t.length>0&&t.length<=max?t:null};

let renovando=null;
async function renovar(refresh){
  const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:CHAVE,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.access_token){if(r.status<500)gravarSessao(null);throw new ErroApi('',r.status<500?401:r.status)}
  const s=sessaoDe(d);gravarSessao(s);return s;
}
async function token(forcar){
  const s=lerSessao();if(!s)throw new ErroApi('',401);
  if(!forcar&&s.exp-60000>Date.now())return s.access;
  renovando=renovando||renovar(s.refresh).finally(()=>{renovando=null});
  return (await renovando).access;
}
function erroDe(status,d){
  const c=d&&d.code,m=d&&d.message;
  if(status===401||c==='PGRST301'||c==='PGRST303')return new ErroApi('',401);
  if(c==='23505')return new ErroApi('Esse número já está cadastrado.',409);
  if(c==='23503')return new ErroApi('Folha não encontrada.',404);
  if(c==='P0001')return new ErroApi(m||'Operação não permitida.',409);
  if(c==='23514'||c==='22003'||c==='22P02')return new ErroApi('Valor inválido.',400);
  if(c==='42501')return new ErroApi('Sem permissão. Entre novamente.',403);
  console.error(status,d);return new ErroApi('Erro interno. Tente novamente.',500);
}
async function rest(metodo,caminho,corpo,extra,jaTentou){
  const tk=await token(false);
  const r=await fetch(SB+'/rest/v1'+caminho,{method:metodo,headers:{apikey:CHAVE,Authorization:'Bearer '+tk,'Content-Type':'application/json',...(extra||{})},body:corpo===undefined?undefined:JSON.stringify(corpo)});
  const d=r.status===204?null:await r.json().catch(()=>null);
  if(r.status===401&&!jaTentou){await token(true);return rest(metodo,caminho,corpo,extra,true)}
  if(!r.ok)throw erroDe(r.status,d);
  return d;
}
const rpc=(fn,args)=>rest('POST','/rpc/'+fn,args||{});

async function entrar(b){
  if(!configurado())throw new ErroApi('Falta configurar o arquivo config.js (URL e chave do Supabase).');
  const email=texto(b.email,200),senha=typeof b.senha==='string'?b.senha:'';
  if(!email||!senha)throw new ErroApi('Informe o e-mail e a senha.');
  const r=await fetch(SB+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:CHAVE,'Content-Type':'application/json'},body:JSON.stringify({email,password:senha})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok||!d.access_token){await espera(1000);throw new ErroApi(r.status===400?'E-mail ou senha incorretos.':'Não foi possível entrar. Tente novamente.',r.status)}
  gravarSessao(sessaoDe(d));try{localStorage.setItem(K_EMAIL,email)}catch(e){}
  return {ok:true};
}
async function sair(){
  const s=lerSessao();gravarSessao(null);
  if(s&&configurado())await fetch(SB+'/auth/v1/logout',{method:'POST',headers:{apikey:CHAVE,Authorization:'Bearer '+s.access}}).catch(()=>{});
  return {ok:true};
}

/* mesmas rotas de antes: o resto do app não mudou */
async function rota(m,p,b){
  let x;
  if(m==='POST'&&p==='/login')return entrar(b);
  if(m==='POST'&&p==='/logout')return sair();
  if(m==='GET'&&p==='/sessao'){if(!configurado())throw new ErroApi('',401);await token(false);return {ok:true}}

  if(m==='GET'&&p==='/folhas')return (await rpc('pos_folhas'))||[];
  if(m==='POST'&&p==='/folhas'){
    const n=inteiro(b.numero,0,999999999);if(n===null)throw new ErroApi('Número da folha inválido (0 a 999999999).');
    await rest('POST','/folhas',{numero:n});return {ok:true};
  }
  if((x=p.match(/^\/folhas\/(\d+)$/))&&m==='DELETE'){
    const r=await rest('DELETE','/folhas?numero=eq.'+x[1],undefined,{Prefer:'return=representation'});
    if(!r||!r.length)throw new ErroApi('Folha não encontrada.',404);return {ok:true};
  }
  if((x=p.match(/^\/folhas\/(\d+)\/bottons$/))){
    const f=Number(x[1]);
    if(m==='GET')return (await rpc('pos_bottons',{p_folha:f}))||[];
    if(m==='POST'){
      const n=inteiro(b.numero,0,99);if(n===null)throw new ErroApi('Número do botton inválido (0 a 99).');
      await rest('POST','/bottons',{folha:f,numero:n});return {ok:true};
    }
  }
  if((x=p.match(/^\/folhas\/(\d+)\/bottons\/(\d+)$/))&&m==='DELETE'){
    const r=await rest('DELETE','/bottons?folha=eq.'+x[1]+'&numero=eq.'+x[2],undefined,{Prefer:'return=representation'});
    if(!r||!r.length)throw new ErroApi('Botton não encontrado.',404);return {ok:true};
  }
  if((x=p.match(/^\/folhas\/(\d+)\/bottons\/(\d+)\/entregar$/))&&m==='POST'){
    const preco=dinheiro(b.preco);if(!preco)throw new ErroApi('Informe o preço de venda.');
    await rpc('entregar',{p_folha:Number(x[1]),p_botton:Number(x[2]),p_preco:preco,p_a_receber:b.a_receber===true});return {ok:true};
  }
  if(m==='GET'&&p==='/a-receber')return (await rpc('pos_a_receber'))||[];
  if((x=p.match(/^\/a-receber\/(\d+)\/(\d+)\/receber$/))&&m==='POST'){
    await rpc('receber',{p_folha:Number(x[1]),p_botton:Number(x[2])});return {ok:true};
  }
  if(m==='GET'&&p==='/caixa'){
    const d=await rpc('pos_caixa',{p_limite:100});return {totais:d?.totais||{},historico:d?.historico||[]};
  }
  if(m==='POST'&&(p==='/caixa/custear'||p==='/caixa/investir')){
    const valor=dinheiro(b.valor),desc=texto(b.descricao);
    if(!valor)throw new ErroApi('Informe um valor válido.');
    if(!desc)throw new ErroApi('A descrição é obrigatória.');
    await rpc(p==='/caixa/custear'?'custear':'investir',{p_valor:valor,p_descricao:desc});return {ok:true};
  }
  throw new ErroApi('Rota não encontrada.',404);
}
async function api(m,p,b){
  try{return await rota(m,p,b||{})}
  catch(e){
    if(e.status===401&&p!=='/login'){mostrarLogin();throw new Error('')}
    if(e instanceof ErroApi)throw e;
    throw new Error('Sem conexão. Tente novamente.');
  }
}
const falha=e=>{if(e.message)alert(e.message)};
function mostrarLogin(){$('#app').hidden=true;$('#login').hidden=false;try{$('#email').value=$('#email').value||localStorage.getItem(K_EMAIL)||''}catch(e){}($('#email').value?$('#senha'):$('#email')).focus()}
async function iniciar(){
  try{await api('GET','/sessao');$('#login').hidden=true;$('#app').hidden=false;trocar(aba)}catch(e){mostrarLogin()}
}
$('#entrar').onclick=async()=>{
  $('#lerr').textContent='';
  try{await api('POST','/login',{email:$('#email').value,senha:$('#senha').value});$('#senha').value='';iniciar()}catch(e){$('#lerr').textContent=e.message}
};
$('#senha').onkeydown=$('#email').onkeydown=e=>{if(e.key==='Enter')$('#entrar').click()};
$('#sair').onclick=async()=>{await api('POST','/logout',{}).catch(()=>{});mostrarLogin()};

document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>trocar(b.dataset.tab));
function trocar(t){
  aba=t;
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.tab===t));
  ['estoque','areceber','caixa'].forEach(x=>$('#t-'+x).hidden=x!==t);
  ({estoque:folhaAberta===null?listarFolhas:abrirFolha,areceber:listarReceber,caixa:mostrarCaixa})[t](folhaAberta);
  contarReceber();
}
async function contarReceber(){try{const l=await api('GET','/a-receber');$('#nrec').hidden=!l.length;$('#nrec').textContent=l.length}catch(e){}}

/* ---------- Diálogo ---------- */
function dialogo(html,ok){
  const d=$('#dlg');d.innerHTML=html;d.showModal();
  d.querySelector('[data-x]').onclick=()=>d.close();
  d.querySelector('form').onsubmit=async e=>{e.preventDefault();try{await ok(new FormData(e.target));d.close()}catch(er){falha(er)}};
}

/* ---------- ESTOQUE · folhas ---------- */
async function listarFolhas(){
  folhaAberta=null;const el=$('#t-estoque');
  const l=await api('GET','/folhas').catch(falha)||[];
  el.innerHTML=`<h2>Folhas</h2>
  <form class="card row" id="nf"><input name="n" type="number" inputmode="numeric" min="0" max="999999999" placeholder="Nº da folha (0 = Lote 1)" required style="flex:1;min-width:0"><button class="btn">Cadastrar</button></form>
  <div class="grid">${l.map(f=>`<div class="card"><div class="row sp"><b>Folha ${cod(f.numero)}</b><small>Lote: ${Number(f.lote).toLocaleString('pt-BR')}</small></div>
  <p class="m" style="margin:.3rem 0 .7rem"><span class="${f.bottons>0?(f.entregues===f.bottons?'ok':'bad'):''}">${f.bottons} botton(s) · ${f.entregues} entregue(s)</span></p>
  <div class="row"><button class="btn sm" data-abrir="${f.numero}">Abrir</button><button class="btn sm x" data-delf="${f.numero}">Excluir</button></div></div>`).join('')||'<p class="m">Nenhuma folha cadastrada.</p>'}</div>`;
  $('#nf').onsubmit=async e=>{e.preventDefault();try{await api('POST','/folhas',{numero:e.target.n.value});listarFolhas()}catch(er){falha(er)}};
  el.querySelectorAll('[data-abrir]').forEach(b=>b.onclick=()=>abrirFolha(b.dataset.abrir));
  el.querySelectorAll('[data-delf]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir a folha '+cod(b.dataset.delf)+' e seus bottons não entregues?'))try{await api('DELETE','/folhas/'+b.dataset.delf);listarFolhas()}catch(er){falha(er)}});
  paginar(el);
}

/* ---------- ESTOQUE · bottons ---------- */
async function abrirFolha(f){
  folhaAberta=f;const el=$('#t-estoque');
  const l=await api('GET','/folhas/'+f+'/bottons').catch(falha)||[];
  el.innerHTML=`<div class="row sp"><button class="btn sm s" id="voltar">← Folhas</button><b>Folha ${cod(f)}</b></div>
  <form class="card row" id="nb" style="margin-top:.8rem"><input name="n" type="number" inputmode="numeric" min="0" max="99" placeholder="Nº do botton (0 a 99)" required style="flex:1;min-width:0"><button class="btn">Cadastrar</button></form>
  <div class="grid">${l.map(b=>`<div class="card"><div class="row sp"><b>${esc(b.pid)}</b><small>Item: ${b.item}</small></div>
  <p class="m" style="margin:.3rem 0">Feito em ${esc(b.fabricado_em)}</p>
  ${b.status==='estoque'?'<p class="tag" style="margin:.2rem 0 .6rem">falta entregar!</p><div class="row"><button class="btn sm" data-ent="'+b.numero+'">ENTREGAR</button><button class="btn sm x" data-delb="'+b.numero+'">Excluir</button></div>'
  :`<p style="margin:.2rem 0">Entregue em ${esc(b.entregue_em)} · ${brl(b.preco_venda)}</p><p class="${b.status==='recebido'?'ok':'tag'}" style="margin:0">${b.status==='recebido'?'Recebido':'A receber'}</p>`}</div>`).join('')||'<p class="m">Nenhum botton nesta folha.</p>'}</div>`;
  $('#voltar').onclick=listarFolhas;
  $('#nb').onsubmit=async e=>{e.preventDefault();try{await api('POST','/folhas/'+f+'/bottons',{numero:e.target.n.value});abrirFolha(f)}catch(er){falha(er)}};
  el.querySelectorAll('[data-delb]').forEach(b=>b.onclick=async()=>{if(confirm('Excluir este botton?'))try{await api('DELETE','/folhas/'+f+'/bottons/'+b.dataset.delb);abrirFolha(f)}catch(er){falha(er)}});
  el.querySelectorAll('[data-ent]').forEach(b=>b.onclick=()=>dialogo(
    `<form method="dialog"><h2>Entregar botton ${String(b.dataset.ent).padStart(2,'0')}</h2><input name="preco" inputmode="decimal" placeholder="Preço de venda (R$)" required>
    <label class="c"><input type="checkbox" name="rec"> Ainda vou receber o valor</label>
    <div class="row"><button class="btn">Entregar</button><button type="button" class="btn s" data-x>Cancelar</button></div></form>`,
    async fd=>{await api('POST','/folhas/'+f+'/bottons/'+b.dataset.ent+'/entregar',{preco:fd.get('preco'),a_receber:fd.get('rec')==='on'});abrirFolha(f);contarReceber()}));
  paginar(el);
}

/* ---------- À RECEBER ---------- */
async function listarReceber(){
  const el=$('#t-areceber');const l=await api('GET','/a-receber').catch(falha)||[];
  el.innerHTML=`<h2>À Receber</h2><div class="grid">${l.map(b=>`<div class="card"><div class="row sp"><b>${esc(b.pid)}</b><b>${brl(b.preco_venda)}</b></div>
  <p class="m" style="margin:.3rem 0 .6rem">Entregue em ${esc(b.entregue_em)}</p><button class="btn g sm" data-rec="${b.folha}/${b.botton}">Recebi!</button></div>`).join('')||'<p class="m">Nada a receber.</p>'}</div>`;
  el.querySelectorAll('[data-rec]').forEach(b=>b.onclick=async()=>{try{await api('POST','/a-receber/'+b.dataset.rec+'/receber',{});listarReceber();contarReceber()}catch(er){falha(er)}});
  paginar(el);
}

/* ---------- CAIXA ---------- */
const nomes={entrega:'Entrega',recebimento:'Recebimento',custeio:'Custeio',investimento:'Investimento'};
async function mostrarCaixa(){
  const el=$('#t-caixa');const d=await api('GET','/caixa').catch(falha);if(!d)return;
  const t=d.totais||{};
  el.innerHTML=`<h2>Caixa</h2><div class="stats"><div class="card"><small>Bottons</small><b>${t.qtd_bottons||0}</b></div><div class="card"><small>Custo</small><b>${brl(t.custo)}</b></div><div class="card"><small>Lucro</small><b>${brl(t.lucro)}</b></div></div>
  <div class="row" style="margin:.8rem 0"><button class="btn" data-mov="custear" style="flex:1">Custear</button><button class="btn g" data-mov="investir" style="flex:1">Investir</button></div>
  <h2>Histórico</h2><div class="grid">${d.historico.map(h=>{
    const v=h.tipo==='recebimento'?`<small>Custo <span class="pos">+${brl(h.custo_delta)}</span> · Lucro <span class="pos">+${brl(h.lucro_delta)}</span></small>`
      :h.tipo==='custeio'?`<span class="neg">−${brl(h.valor)}</span>`:h.tipo==='investimento'?`<span class="pos">+${brl(h.valor)}</span>`:'';
    return `<div class="card"><div class="row sp"><b>${nomes[h.tipo]}</b><b>${h.tipo==='entrega'||h.tipo==='recebimento'?brl(h.valor):v}</b></div>
    <small class="m">${esc(h.quando)}${h.pid?' · '+esc(h.pid):''}${h.descricao?' · '+esc(h.descricao):''}</small>${h.tipo==='recebimento'?'<div>'+v+'</div>':''}</div>`}).join('')||'<p class="m">Sem movimentações.</p>'}</div>`;
  el.querySelectorAll('[data-mov]').forEach(b=>b.onclick=()=>{const c=b.dataset.mov==='custear';dialogo(
    `<form method="dialog"><h2>${c?'Custear':'Investir'}</h2><input name="valor" inputmode="decimal" placeholder="Valor (R$)" required style="margin-bottom:.6rem">
    <input name="descricao" maxlength="200" placeholder="Descrição (obrigatória)" required>
    <div class="row" style="margin-top:.8rem"><button class="btn ${c?'':'g'}">${c?'Pegar':'Investir'}</button><button type="button" class="btn s" data-x>Cancelar</button></div></form>`,
    async fd=>{await api('POST','/caixa/'+b.dataset.mov,{valor:fd.get('valor'),descricao:fd.get('descricao')});mostrarCaixa()})});
  paginar(el);
}
iniciar();
</script>

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('service-worker.js').catch(() => {}); });
}
</script>
