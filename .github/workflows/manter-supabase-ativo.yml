# Evita a pausa por inatividade no plano gratuito do Supabase.
# Faz uma consulta pública leve (consultar_pid, sem dados) duas vezes por semana,
# usando a URL e a chave publishable do config.js.
name: Manter Supabase ativo

on:
  schedule:
    # 00:00 no horário de Brasília (UTC-3) = 03:00 UTC, às segundas e quintas.
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Baixar configuração pública
        uses: actions/checkout@v5

      - name: Consulta pública de teste
        shell: bash
        run: |
          set -euo pipefail
          URL=$(sed -n "s/^[[:space:]]*SUPABASE_URL:[[:space:]]*'\([^']*\)'.*/\1/p" config.js | head -n 1)
          CHAVE=$(sed -n "s/^[[:space:]]*SUPABASE_CHAVE:[[:space:]]*'\([^']*\)'.*/\1/p" config.js | head -n 1)
          test -n "$URL" && test -n "$CHAVE"
          curl --fail --silent --show-error --retry 3 --max-time 20 \
            -X POST "$URL/rest/v1/rpc/consultar_pid" \
            -H "apikey: $CHAVE" \
            -H "Authorization: Bearer $CHAVE" \
            -H "Content-Type: application/json" \
            -d '{"p_pid":"PID-000-000-000/00"}' \
            -o /dev/null
